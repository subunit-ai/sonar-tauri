<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f1f33"/>
      <stop offset="0.55" stop-color="#0a1626"/>
      <stop offset="1" stop-color="#030b18"/>
    </linearGradient>
    <radialGradient id="core" cx="512" cy="512" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8fdff"/>
      <stop offset="0.4" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </radialGradient>
    <radialGradient id="sweep" cx="512" cy="512" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- App-Icon-Hintergrund (Familien-Look: Deep Navy, abgerundetes Quadrat) -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="216" fill="none" stroke="#06b6d4" stroke-opacity="0.18" stroke-width="6"/>

  <!-- Sonar-Lichtkegel (aktiv abtastend), größer + nach RECHTS zeigend (±32°) -->
  <path d="M512 512 L911 263 A470 470 0 0 1 911 761 Z" fill="url(#sweep)"/>

  <!-- Konzentrische Ping-Wellen -->
  <circle cx="512" cy="512" r="448" fill="none" stroke="#06b6d4" stroke-opacity="0.12" stroke-width="10"/>
  <circle cx="512" cy="512" r="356" fill="none" stroke="#06b6d4" stroke-opacity="0.28" stroke-width="14"/>
  <circle cx="512" cy="512" r="252" fill="none" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="18"/>
  <circle cx="512" cy="512" r="148" fill="none" stroke="#22d3ee" stroke-opacity="0.9" stroke-width="20"/>

  <!-- Leuchtender Kern (Sender) -->
  <circle cx="512" cy="512" r="54" fill="url(#core)" filter="url(#glow)"/>
</svg>
