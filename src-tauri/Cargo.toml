[package]
name = "sonar"
version = "0.1.0"
description = "Sonar — der Agent auf der Maschine (Forge + Trace in einer App)"
authors = ["Subunit UG"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name unique from the bin name (Windows quirk,
# see https://github.com/rust-lang/cargo/issues/8519).
name = "sonar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
keyring = "3.6.1"
tauri = { version = "=2.11.2", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-updater = "=2.10.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tokio = { version = "=1.52.3", features = ["time"] }
# Account-Login (OAuth-Loopback gegen auth.subunit.ai) — portiert aus echo/auth.rs
anyhow = "=1.0.100"
base64 = "=0.22.1"
rand = "=0.8.5"
parking_lot = "=0.12.5"
dirs = "=5.0.1"
# Crash/Error-Reporting (rustls-Transport, kein OpenSSL). No-op ohne DSN.
# DSGVO: nur Fehlertyp/Stacktrace/Plattform in Events — NIE Trace-/Fensterinhalte.
sentry = { version = "=0.34.0", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "reqwest",
  "rustls",
] }
# Trace (Task-Mining) — eigenes Repo trace-tauri, in-process konsumiert. Lokal via Symlink
# trace-src→../trace-tauri, in CI per Deploy-Key zum Tag ausgecheckt (gepinnt = Versionierung).
trace-engine = { path = "../trace-src" }
