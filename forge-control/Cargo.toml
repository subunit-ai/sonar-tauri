[package]
name = "forge-control"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
enigo = "0.6.1"
image = "0.25"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
xcap = "0.9.6"

# Windows-Cursor-Positionierung via SetCursorPos statt enigos SendInput-Move (der auf
# realer Kundenhardware universell mit "not all input events were sent" abgewiesen wurde)
# + Per-Monitor-DPI-Awareness. Version 0.61 = die, die enigo/xcap ohnehin schon ziehen.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }
