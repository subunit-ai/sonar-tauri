name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Checkout trace-engine source (pinned, read-only deploy key) → trace-src
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: subunit-ai/trace-tauri
          ref: a03cd0ef5d28a78dbc137c945bccb98824e17a99 # v0.1.13 — MUSS dem release.yml-Pin entsprechen, sonst passt Cargo.lock nicht (--locked) und CI ist dauer-rot (so seit v0.1.43)
          ssh-key: ${{ secrets.TRACE_DEPLOY_KEY }}
          path: trace-src
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
      - name: Linux Tauri-Systemdeps (+ libxcb für active-win-pos-rs)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Frontend deps + build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Stub-Sidecar (CI baut keinen echten — nur externalBin-Existenz-Check für cargo)
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/subunit-bridge-x86_64-unknown-linux-gnu
      - name: cargo check + clippy
        working-directory: src-tauri
        run: |
          cargo check --locked
          cargo clippy --locked -- -D warnings || cargo clippy --locked
