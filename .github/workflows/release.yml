name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Signing (cert-gated): WINDOWS_CERTIFICATE / APPLE_* Secrets → schaltet sich via if-Gate an.
# Updater-Signing: TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD).
# Architektur: Sidecars werden EINMAL auf Linux gebaut (Bun cross-compile inkl. Windows-Targets)
# und als Artifact verteilt — vermeidet Cross-Repo-Checkout des privaten bridge-tauri auf Windows
# (ssh-key-Permissions-Problem). Win-ARM-Sidecar = x64 via Emulation (Bun hat kein win-arm64).
permissions:
  contents: write

jobs:
  sidecars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Checkout bridge source (pinned, read-only deploy key)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: subunit-ai/bridge-tauri
          ref: a388694af0bc6a20117f557f659c7a323254413c # v0.4.8 (Automation-Runtime 2.2: Scheduler/Executor/CRUD-Routen + Win-read-only-exec-Whitelist)
          ssh-key: ${{ secrets.BRIDGE_DEPLOY_KEY }}
          path: bridge-src
      - name: Checkout trace-engine source (pinned, read-only deploy key)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: subunit-ai/trace-tauri
          ref: a07e1a38468ad01e58deb546b09c923b211cd713 # v0.1.7 (schema_v3 UiPath-Selector/Event-Vertrag: UiSelector + closed-enum field_class/app_category/copy_shape + dwell/gap/click; additiv, Producer=Phase2-gated)
          ssh-key: ${{ secrets.TRACE_DEPLOY_KEY }}
          path: trace-co
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.11 }
      - name: Build all sidecars + manifest (Bun cross-compile)
        env:
          BRIDGE_SRC: ${{ github.workspace }}/bridge-src
        run: bash scripts/fetch-sidecars.sh
      - name: Pack trace-engine source (linux-checkout → Artifact, vermeidet Windows-ssh-Checkout)
        run: tar -czf trace-src.tgz -C trace-co --exclude=.git --exclude=target .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sidecars
          path: |
            src-tauri/binaries/subunit-bridge-*
            scripts/sidecar-sha256.txt
            trace-src.tgz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: sidecars
    strategy:
      fail-fast: false
      matrix:
        include:
          # forge_target = Rust-Target-Triple, das Tauri für den forge-control-Sidecar (externalBin)
          # erwartet — identisch zum Tauri-Build-Target (bzw. Host-Triple bei den Nicht-Cross-Zeilen).
          - { os: windows-latest, args: "--bundles nsis", forge_target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, args: "--target aarch64-pc-windows-msvc --bundles nsis", forge_target: aarch64-pc-windows-msvc }
          - { os: ubuntu-latest,  args: "--bundles deb", forge_target: x86_64-unknown-linux-gnu }
          # Beide macOS-Builds auf macos-14 (Apple Silicon, plentiful Runner); der x64-Build
          # cross-compiliert nativ (Apple-Toolchain). Vermeidet die knappen/auslaufenden macos-13-Runner.
          - { os: macos-14,       args: "--target aarch64-apple-darwin --bundles app,dmg", forge_target: aarch64-apple-darwin }
          - { os: macos-14,       args: "--target x86_64-apple-darwin --bundles app,dmg", forge_target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download sidecars
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sidecars
          path: ${{ github.workspace }}
      - name: Unpack trace-engine source (für die Cargo-Path-Dependency ../trace-src)
        shell: bash
        run: mkdir -p trace-src && tar -xzf trace-src.tgz -C trace-src
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.11 }
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
      - name: macOS Rust-Targets (x64-Cross auf Apple Silicon)
        if: startsWith(matrix.os, 'macos')
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Linux Tauri-Systemdeps (+ libxcb für active-win-pos-rs)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxdo-dev libpipewire-0.3-dev clang \
            libgbm-dev libegl1-mesa-dev libwayland-dev
      - name: Make linux sidecar executable
        if: matrix.os == 'ubuntu-latest'
        run: chmod +x src-tauri/binaries/subunit-bridge-x86_64-unknown-linux-gnu || true
      - name: Make macOS sidecar executable
        if: startsWith(matrix.os, 'macos')
        run: chmod +x src-tauri/binaries/subunit-bridge-*apple-darwin || true
      - name: Build forge-control sidecar (Augen+Hände, nativ pro Target → externalBin)
        # forge-control (xcap-Capture + enigo-Input) ist plattformspezifisch → NICHT cross von Linux
        # gebaut wie der Bun-Bridge-Sidecar, sondern nativ auf jedem Matrix-Runner für sein Triple.
        # Ergebnis muss VOR tauri-action in binaries/ liegen (externalBin wird beim Bundlen aufgelöst).
        # CARGO_HTTP_MULTIPLEXING=false + Retries: crates.io-Downloads auf den Win-ARM-Runnern
        # werfen sonst sporadisch "HTTP2 framing layer"-Fehler (v0.1.18 Flake).
        shell: bash
        env:
          CARGO_NET_RETRY: "5"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          rustup target add ${{ matrix.forge_target }}
          cargo build --release --manifest-path forge-control/Cargo.toml --target ${{ matrix.forge_target }}
          ext=""; [[ "${{ matrix.forge_target }}" == *windows* ]] && ext=".exe"
          mkdir -p src-tauri/binaries
          cp "forge-control/target/${{ matrix.forge_target }}/release/forge-control$ext" \
             "src-tauri/binaries/forge-control-${{ matrix.forge_target }}$ext"
          ls -la src-tauri/binaries/
      - name: Frontend deps
        run: bun install --frozen-lockfile
      - name: macOS Signing-Keychain (stabiles self-signed Cert -> TCC-Grants ueberleben Updates)
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "kein Signing-Cert konfiguriert -> bleibe ad-hoc"; exit 0
          fi
          # Keychain-Dance SELBST (nicht via tauri-action cert-env): das Cert ist self-signed,
          # codesign verweigert eine untrusted Identity (CSSMERR_TP_NOT_TRUSTED) -> add-trusted-cert
          # unten trustet sie. Muster aus echo-tauri (dort produktiv bewaehrt).
          echo "$APPLE_CERTIFICATE" | base64 -d > /tmp/sonar-sign.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/sonar-sign.p12 -k build.keychain -P "${APPLE_CERTIFICATE_PASSWORD:-}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain > /dev/null
          security find-certificate -c "$APPLE_SIGNING_IDENTITY" -p build.keychain > /tmp/sonar-sign.pem
          # add-trusted-cert -r trustRoot ist NUR fuer self-signed Certs. Ein Apple-issued Cert (Developer/
          # Development) ist ueber Apples Chain bereits vertraut -> trustRoot wirft SecTrustSettingsSetTrustSettings
          # (ungueltige Parameter). Daher non-fatal: bei self-signed greift es, beim Apple-Cert wird es uebersprungen.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain /tmp/sonar-sign.pem \
            || echo "add-trusted-cert uebersprungen (Apple-issued Cert ist ueber Apples Chain bereits vertraut)"
          rm /tmp/sonar-sign.p12
          echo "gueltige codesigning-Identities:"
          security find-identity -v -p codesigning build.keychain
      - name: Build + release (Tauri)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Crash-Reporting: DSN zur Compile-Zeit einbacken (option_env! in lib.rs run()).
          SONAR_SENTRY_DSN: ${{ secrets.SONAR_SENTRY_DSN }}
          # macOS: STABILE Signing-Identity (env ueberschreibt tauri.conf "-"/ad-hoc). Identity-stabiles
          # Signing laesst macOS-TCC-Grants (Screen-Recording/Accessibility fuer Forge) Updates UEBERLEBEN
          # — ad-hoc signiert jeden Build neu -> macOS sieht "neue App" und verwirft die Grants. Das Cert
          # wird im Keychain-Step oben importiert + getrusted; hier NUR die Identity an tauri-action
          # (NICHT APPLE_CERTIFICATE — das wuerde tauri-action es untrusted in seine Keychain neu importieren).
          # cert-gated: ohne gesetzte Secrets baut macOS weiter ad-hoc (Keychain-Step exitet 0).
          # Nach Firmengruendung: Developer-ID-Cert + Notarisierung (APPLE_ID/_PASSWORD/_TEAM_ID) ergaenzen. Ad-hoc-Fallback '-' wenn kein Cert (leerer Secret-String wuerde sonst tauri.conf "-" ueberschreiben -> codesign mit leerer Identity scheitert).
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Sonar ${{ github.ref_name }}"
          # Veröffentlicht (kein Draft) → Releases sind als Versionen sichtbar UND der Auto-Updater
          # findet `/releases/latest` (Drafts werden vom Updater nie aufgelöst).
          releaseDraft: false
          args: ${{ matrix.args }}
